name: Build Zoomy Park Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android platform & sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Google AdMob Test App ID into AndroidManifest
        run: |
          node --input-type=module -e '
            import fs from "fs";
            const file = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(file, "utf8");
            if (!xml.includes("com.google.android.gms.ads.APPLICATION_ID")) {
              xml = xml.replace(
                "</application>",
                `    <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-3940256099942544~3347511713" />\n    </application>`
              );
              fs.writeFileSync(file, xml);
            }
          '

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          yes | sdkmanager --licenses || true
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoomy-park-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
